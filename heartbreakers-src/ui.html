<title>BGC: Heartbreakers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Montserrat:wght@600;700;800&display=swap">
<style>
/* Layout: one-screen card table. Game totals on top; the felt holds four seat plates (Across top, Left/Right sides, You bottom) around the trick; status and your hand underneath. Single noir theme by design. */
:root {
  --ink: #12060f;
  --felt: #1d0a18;
  --felt-hi: #2c1026;
  --plate: rgba(26, 9, 23, .74);
  --line: rgba(214, 200, 214, .45);
  --bone: #f6edf2;
  --mute: #c6b0bf;
  --red: #ff3d8e;
  --silver: #ece8f2;
  --club: #4fe3b2;
  --violet: #b28cff;
  --face: #2b0f27;
  --face-2: #150712;
  --serif: "Quicksand", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --caps: "Montserrat", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --display: var(--serif);
  --ui: var(--serif);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 42%, var(--felt-hi) 0%, var(--felt) 48%, var(--ink) 100%);
  background-color: var(--ink);
  color: var(--bone);
  font-family: var(--ui);
  font-size: 15px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 12px;
  max-width: 760px; margin: 0 auto; box-sizing: border-box;
}
button { font: inherit; color: inherit; }
button:focus-visible, .card:focus-visible, label:focus-within { outline: 2px solid var(--violet); outline-offset: 2px; }

/* game totals */
.rail { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto auto; gap: 8px; align-items: end; }
.score { border-bottom: 1px solid var(--line); padding: 2px 0 6px; min-width: 0; }
.score .who { font-size: 11px; font-weight: 600; letter-spacing: .08em; line-height: 1.15; text-transform: uppercase; color: var(--mute); overflow-wrap: anywhere; }
.score .tot { font-weight: 700; font-size: 24px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.score.me .who { color: var(--bone); }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; background: none; border: 1px solid var(--line); border-radius: 10px; color: var(--bone); cursor: pointer; padding: 0; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.off { color: var(--mute); }

/* felt */
.table {
  display: grid; min-height: 0; padding-block: 10px 4px;
  grid-template-columns: 96px minmax(0, 1fr) 96px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "left trick right";
  gap: 8px; align-items: center; justify-items: center;
}
.plate {
  position: relative; z-index: 1; box-sizing: border-box;
  display: flex; align-items: center; gap: 12px;
  background: var(--plate); border: 1px solid var(--line); border-radius: 12px;
  padding: 7px 12px; transition: border-color .2s, box-shadow .2s;
}
#plate2 { grid-area: top; } #plate0 { grid-area: me; }
#plate1 { grid-area: left; } #plate3 { grid-area: right; }
.plate.side { flex-direction: column; gap: 6px; width: 100%; padding: 9px 4px; text-align: center; }
.plate .whoc { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; }
.plate.side .whoc { align-items: center; }
.plate .nm { font-weight: 700; font-size: 15px; white-space: nowrap; }
.av { flex: none; width: 66px; height: 66px; image-rendering: pixelated; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(circle at 35% 30%, #3a2f45, #17131c); border: 1.5px solid color-mix(in srgb, var(--red) 60%, var(--violet));
  font-family: var(--display); font-size: 22px; color: var(--bone); background-size: cover; background-position: center top; }
.plate.side .nm, .app[data-layout="stage"] #plate2 .nm { font-size: 13.5px; max-width: 100%; white-space: normal; line-height: 1.15; text-wrap: balance; }
.plate.side .whoc { max-width: 100%; align-items: center; }
.lvl { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); border: 1px solid var(--line); border-radius: 99px; padding: 2px 7px; }
.lvl.genius { color: var(--violet); border-color: color-mix(in srgb, var(--violet) 55%, transparent); }
.rpw { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.plate:not(.side) .rpw { border-left: 1px solid var(--line); padding-left: 12px; }
.rp { font-weight: 800; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--mute); display: inline-block; }
.rp.has { color: var(--red); }
.rp.bump { animation: bump .55s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
.rl { font-size: 11px; color: var(--mute); white-space: nowrap; }
.plate.turn { border-color: var(--red); box-shadow: 0 0 0 1px var(--red), 0 0 24px color-mix(in srgb, var(--red) 30%, transparent); }

.trick { grid-area: trick; position: relative; z-index: 5; width: 100%; max-width: 260px; height: 100%; min-height: 220px; max-height: 300px; }
.slot { position: absolute; }
.slot.s0 { left: 50%; bottom: 0; translate: -50% 0; }
.slot.s2 { left: 50%; top: 0; translate: -50% 0; }
.slot.s1 { left: 0; top: 50%; translate: 0 -50%; }
.slot.s3 { right: 0; top: 50%; translate: 0 -50%; }
.slot.s0 .card.enter { animation: in0 .28s ease-out; }
.slot.s1 .card.enter { animation: in1 .28s ease-out; }
.slot.s2 .card.enter { animation: in2 .28s ease-out; }
.slot.s3 .card.enter { animation: in3 .28s ease-out; }
@keyframes in0 { from { transform: translateY(90px); opacity: 0; } }
@keyframes in1 { from { transform: translateX(-80px); opacity: 0; } }
@keyframes in2 { from { transform: translateY(-80px); opacity: 0; } }
@keyframes in3 { from { transform: translateX(80px); opacity: 0; } }
.slot .card.won { box-shadow: 0 0 0 2px var(--bone), 0 10px 30px rgba(0,0,0,.6); }
.card.bounce { animation: qsBounce 1s cubic-bezier(.3, .6, .4, 1), qsGlow 1.6s ease-out; }
@keyframes qsBounce {
  0% { transform: translateY(-80px) scale(1.2); opacity: 0; }
  28% { transform: translateY(0) scale(1); opacity: 1; }
  44% { transform: translateY(-24px) scale(1.05) rotate(-3deg); }
  60% { transform: translateY(0) scale(1) rotate(0); }
  72% { transform: translateY(-10px) rotate(2deg); }
  84% { transform: translateY(0) rotate(0); }
  93% { transform: translateY(-3px); }
  100% { transform: translateY(0); }
}
@keyframes qsGlow { 0%, 45% { box-shadow: 0 0 0 2px var(--violet), 0 0 40px color-mix(in srgb, var(--violet) 75%, transparent); } }

/* status */
.status { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 10px; text-align: center; min-height: 58px; justify-content: center; }
.status .row { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
.status .msg { font-size: 16px; font-weight: 500; }
.status .msg b { font-weight: 800; color: var(--bone); }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; color: var(--mute); white-space: nowrap; }
.pill.count { color: var(--bone); }
.pill.mine { color: var(--bone); border-color: var(--mute); }
.pill.mine .rp { font-size: 13px; margin-right: 4px; color: var(--bone); }
.pill.mine .rp.has { color: var(--red); }
.pill.broken { color: var(--red); border-color: color-mix(in srgb, var(--red) 50%, transparent); }
.pill.pop { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
.cta { background: var(--bone); color: var(--ink); border: 0; border-radius: 99px; padding: 10px 20px; font-weight: 700; font-size: 15px; cursor: pointer; }
.cta:disabled { background: var(--line); color: var(--mute); cursor: default; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 99px; padding: 10px 20px; font-weight: 600; font-size: 15px; cursor: pointer; }

/* hand */
.hand { position: relative; --cw: 70px; --ch: 100px; height: calc(var(--ch) + 22px); }
.hand .card { position: absolute; bottom: 0; width: var(--cw); height: var(--ch); transition: transform .16s ease, filter .16s ease; cursor: pointer;
  transform: rotate(var(--rot, 0deg)) translateY(var(--lift, 0px)); transform-origin: var(--org, 50% 50%); }
.hand .card.sel { --lift: -20px; }
.dh { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; overflow: visible; }

/* layout: Stage — opponents in a row, each card lands under its player */
.app[data-layout="stage"] .table { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "left top right" "trick trick trick"; }
.app[data-layout="stage"] #plate2 { flex-direction: column; gap: 6px; width: 100%; padding: 9px 4px; text-align: center; }
.app[data-layout="stage"] #plate2 .whoc { align-items: center; }
.app[data-layout="stage"] #plate2 .rpw { border-left: 0; padding-left: 0; }

/* portrait seats: head-to-chest sprite windows */
.plate.seat { flex-direction: column; align-items: stretch; gap: 6px; padding: 6px; text-align: center; }
.plate.seat.side { width: 100%; padding: 6px; }
.pw { position: relative; width: 100%; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 8px; overflow: hidden;
  background: radial-gradient(85% 65% at 50% 32%, #3b2d48 0%, #17131c 70%, #0e0c11 100%); display: grid; place-items: center; }
.pw img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; display: block; }
.pw .ini { font-family: var(--display); font-size: 30px; color: var(--mute); }
.pinfo { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.pinfo .nm { font-size: 13.5px; font-weight: 700; line-height: 1.15; text-wrap: balance; }
.pinfo .pts { font-size: 11px; color: var(--mute); white-space: nowrap; }
.pinfo .rp { font-size: 19px; margin-right: 3px; vertical-align: -1px; }
#plate2.seat { flex-direction: row; align-items: center; gap: 12px; padding: 6px 16px 6px 6px; }
#plate2.seat .pw { width: 78px; flex: none; }
#plate2.seat .pinfo { align-items: flex-start; }
#plate2.seat .nm { font-size: 15px; }
.app[data-layout="stage"] #plate2.seat { flex-direction: column; align-items: stretch; gap: 6px; padding: 6px; width: 100%; }
.app[data-layout="stage"] #plate2.seat .pw { width: 100%; }
.app[data-layout="stage"] #plate2.seat .pinfo { align-items: center; }
.app[data-layout="stage"] #plate2.seat .nm { font-size: 13.5px; }
.app[data-layout="stage"] .trick { min-height: 186px; }
.quote .pw { width: 64px; flex: none; }
.pw.flip img { transform: scaleX(-1); }
.girls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.girl { position: relative; display: flex; flex-direction: column; gap: 4px; align-items: center; padding: 4px; border: 1.5px solid var(--line); border-radius: 12px; background: rgba(0, 0, 0, .25); cursor: pointer; font-family: var(--serif); font-weight: 700; font-size: 12.5px; text-align: center; line-height: 1.15; }
.girl input { position: absolute; opacity: 0; pointer-events: none; }
.girl .pw { width: 100%; border-radius: 8px; }
.girl:has(input:checked) { border-color: var(--red); box-shadow: 0 0 0 1px var(--red), 0 0 18px rgba(255, 61, 142, .35); }
.mechip { display: inline-flex; align-items: center; gap: 8px; padding: 3px 12px 3px 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--plate); }
.mechip .pw { width: 32px; flex: none; border-radius: 8px; background: transparent; }
.mechip .mi { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
.status .msg .skip { font-weight: 600; font-size: .78em; color: var(--mute); }
.mechip .mn { font-family: var(--serif); font-weight: 700; font-size: 13px; }
.mechip .mh { font-family: var(--caps); font-weight: 700; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--red); }
.handle-in { font: 600 16px var(--serif); color: var(--bone); background: rgba(0, 0, 0, .3); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; }
.handle-in:focus { border-color: var(--red); }
.handle-in::placeholder { color: var(--mute); }
.mechip .mp { font-family: var(--serif); font-size: 12px; color: var(--mute); }
.mechip .rp { font-family: var(--caps); font-size: 15px; color: var(--bone); margin-right: 2px; }
.mechip .rp.has { color: var(--red); }
@media (max-width: 559px) {
  .slot .card { width: 66px; height: 94px; }
  .slot .card .ix b { font-size: 23px; }
  .slot .card .ix i { font-size: 15px; }
  .slot .card .big { font-size: 30px; }
  .trick { min-height: 270px; }
  /* side cards may tuck a little over the seats so the cards can be bigger */
  .app:not([data-layout="stage"]) .slot.s1 { left: -14px; }
  .app:not([data-layout="stage"]) .slot.s3 { right: -14px; }
}
@media (max-width: 559px) {
  .app[data-layout="tworow"] .slot .card { width: 50px; height: 71px; }
  .app[data-layout="tworow"] .slot .card .ix b { font-size: 16px; }
  .app[data-layout="tworow"] .slot .card .ix i { font-size: 12px; }
  .app[data-layout="tworow"] .slot .card .big { font-size: 20px; }
  .app[data-layout="tworow"] .trick { min-height: 214px; }
}
.app[data-layout="stage"] .trick { max-width: 330px; min-height: 214px; max-height: 250px; }
.app[data-layout="stage"] .slot.s1 { left: 0; top: 0; translate: 0 0; }
.app[data-layout="stage"] .slot.s3 { right: 0; top: 0; translate: 0 0; }
.app[data-layout="stage"] .slot.s1 .card.enter, .app[data-layout="stage"] .slot.s3 .card.enter { animation-name: in2; }

/* layout: Big hand — your cards in two rows so more of each card shows */
.app[data-layout="tworow"] .hand { --cw: 70px; --ch: 100px; height: calc(var(--ch) * 1.55 + 22px); }
.app[data-layout="tworow"] .trick { min-height: 196px; max-height: 236px; }
.app[data-layout="tworow"] .slot .card { width: 50px; height: 71px; }
.app[data-layout="tworow"] .slot .card .ix b { font-size: 16px; }
.app[data-layout="tworow"] .slot .card .ix i { font-size: 12px; }
.app[data-layout="tworow"] .slot .card .big { font-size: 20px; }
.hand .card.dim { filter: brightness(.4) saturate(.5); cursor: default; }
/* the three cards passed to you sit a little higher until the first card of the round is played */
.hand .card.got:not(.sel) { --lift: -12px; }
.hand .card { transition: transform .35s ease, filter .16s ease; }

/* cards */
.card {
  --sc: var(--silver);
  position: relative; width: 66px; height: 94px; border-radius: 8px; box-sizing: border-box;
  background: linear-gradient(165deg, var(--face) 0%, var(--face-2) 100%);
  border: 1px solid #443c4e;
  box-shadow: 0 6px 18px rgba(0,0,0,.55);
  color: var(--sc); overflow: hidden;
}
.card.red { --sc: var(--red); }
.card.club { --sc: var(--club); }
.card.qs { border-color: color-mix(in srgb, var(--violet) 70%, transparent); box-shadow: 0 0 16px color-mix(in srgb, var(--violet) 35%, transparent), 0 6px 18px rgba(0,0,0,.55); }
.card .ix { position: absolute; top: 5px; left: 5px; display: flex; flex-direction: column; align-items: center; line-height: .9; z-index: 2; }
.card .ix.br { top: auto; left: auto; right: 5px; bottom: 5px; transform: rotate(180deg); }
.card .ix b { font-weight: 800; font-size: 21px; font-stretch: 82%; font-variation-settings: "wdth" 82; letter-spacing: -.02em; }
.card .ix i { font-style: normal; font-size: 14px; margin-top: 2px; }
.card .port {
  position: absolute; inset: 23% 19% 23% 19%; border-radius: 4px;
  background: radial-gradient(80% 70% at 50% 40%, color-mix(in srgb, var(--sc) 12%, transparent), transparent 75%);
  background-size: cover; background-position: center top;
  display: grid; place-items: center;
}
.card .port.art { inset: 0; border-radius: 0; }
.card .big { font-size: 30px; opacity: .55; }

/* overlays */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
.fx svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.shard { position: absolute; background: linear-gradient(135deg, rgba(255,255,255,.85), rgba(220,225,255,.15)); }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
.bubble { position: absolute; max-width: 210px; box-sizing: border-box; background: var(--bone); color: var(--ink); font-weight: 700; font-size: 14px; line-height: 1.25; padding: 8px 12px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.5); transform-origin: var(--tx) 100%; }
.bubble.down { transform-origin: var(--tx) 0; }
.bubble::after { content: ""; position: absolute; left: calc(var(--tx) - 7px); width: 14px; height: 14px; background: var(--bone); transform: rotate(45deg); border-radius: 2px; }
.bubble.up::after { bottom: -5px; }
.bubble.down::after { top: -5px; }
.bubble.side-l, .bubble.side-r { transform-origin: 0 50%; }
.bubble.side-l::after { left: -5px; top: 14px; }
.bubble.side-r::after { left: auto; right: -5px; top: 14px; }
.bubble span { position: relative; z-index: 1; }
.quote { display: flex; gap: 12px; align-items: center; }
.quote .who { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.quote .q { font-size: 16px; font-weight: 600; margin-top: 2px; }
.veil { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 82%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; place-items: center; z-index: 50; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px); }
.veil[hidden] { display: none; }
.panel { width: 100%; max-width: 420px; background: linear-gradient(170deg, #1d1823, #120f16); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.panel h1 { font-family: var(--display); font-weight: 400; font-size: 50px; line-height: .95; margin: 0; }
.panel h1 span { color: var(--red); }
.panel .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .32em; color: var(--red); margin-bottom: 6px; }
.panel h1 { font-size: clamp(36px, 11vw, 50px); }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.05; margin: 0; text-wrap: balance; }
.panel .sub { color: var(--mute); font-size: 14.5px; margin-top: 8px; line-height: 1.45; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > .lab { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg label { position: relative; text-align: center; padding: 9px 2px; font-size: 13.5px; font-weight: 500; cursor: pointer; color: var(--mute); }
.seg label + label { border-left: 1px solid var(--line); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--bone); color: var(--ink); font-weight: 700; }
.seg label.g:has(input:checked) { background: var(--violet); color: #fff; }
.seatrow { display: grid; grid-template-columns: 58px 1fr; gap: 10px; align-items: center; }
.seatrow .sn { font-size: 14px; font-weight: 700; }
.foot { font-size: 12.5px; color: var(--mute); line-height: 1.5; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--bone); text-decoration: underline; cursor: pointer; }
.btns { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); font-weight: 600; text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { padding: 9px 4px; text-align: right; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); font-size: 15px; }
.tbl td.big { font-weight: 800; font-size: 20px; }
.tbl tr.lead td:first-child { color: var(--red); font-weight: 700; }
.moon { font-family: var(--display); font-size: 20px; color: var(--violet); }
.moonopt { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
.moonopt small { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 10px; font-size: 12px; font-weight: 500; opacity: .85; }

@media (min-width: 560px) {
  .hand, .app[data-layout="tworow"] .hand { --cw: 78px; --ch: 112px; }
  .card { width: 80px; height: 114px; }
  .card .ix b { font-size: 25px; }
  .card .ix i { font-size: 16px; }
  .card .big { font-size: 38px; }

#b-sound { grid-area: snd; } #b-menu { grid-area: menu; }

.score .tot { font-family: var(--caps); font-size: 24px; font-weight: 700; line-height: 1.15; }

.moon { font-family: var(--serif); font-weight: 700; }

// Opponents are drawn only from cast members who have a sprite so far
const ROSTER = { bgc: ['Natalie', 'Judi', 'Victor Twins', 'Amy'] };
// The girls you can be (and play against) are the ones with sprites so far
const playable = () => (ROSTER[S.deck] || CAST[S.deck]).slice();
// Your girl sits out; the three opponents come from everyone else
const pickCast = () => {
  let pool = playable().filter(n => n !== S.me);
  if (pool.length < 3) pool = pool.concat(CAST[S.deck].filter(n => n !== S.me && !pool.includes(n)));
  return ['You', ...shuffle(pool.slice()).slice(0, 3)];
};
// who is speaking: seat 0 is you, voiced by the girl you play as
const voiceOf = p => (p === 0 ? S.me : nameOf(p));
const isPlural = n => /twins|clermonts/i.test(String(n));
const vb = (n, one, many) => (isPlural(n) ? many : one);   // "Natalie takes" / "Victor Twins take"
const nameOf = p => (G && G.names ? G.names[p] : SEATS[p]);
const initials = n => n.split(/\s+/).map(w => w[0]).join('').slice(0, 2);
// Portrait art drops in here later: PORTRAITS[deck][rank] = image URL
const PORTRAITS = { bgc: {} };

const LAYOUTS = [['classic', 'Classic'], ['stage', 'Stage'], ['tworow', 'Big hand'], ['fan', 'Fan']];
const S = { deck: 'bgc', levels: [null, 'medium', 'hard', 'medium'], target: 100, sound: true, layout: 'classic', me: 'Natalie', handle: '' };
try { const saved = JSON.parse(localStorage.getItem('hearts-settings') || 'null'); if (saved) Object.assign(S, saved); } catch (e) {}
S.deck = 'bgc';
if (!playable().includes(S.me)) S.me = playable()[0];
const saveSettings = () => { try { localStorage.setItem('hearts-settings', JSON.stringify(S)); } catch (e) {} };
const applyLayout = () => { document.getElementById('app').dataset.layout = S.layout; };

const suitMark = s => (s === 3 && S.deck === 'bgc' ? DEVIL_HEART : SYM[s]);

let G = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
const sortHand = h => h.slice().sort((a, b) => (suit(a) - suit(b)) || (rank(a) - rank(b)));
const center = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };

// ---------- sound (synthesized, no files) ----------
const SFX = {
  ctx: null,
  unlock() {
    if (!S.sound) return;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  ready() { return S.sound && this.ctx && this.ctx.state === 'running' ? this.ctx : null; },
  wah() { // sad trombone
    const c = this.ready(); if (!c) return;
    const out = c.createGain(); out.gain.value = 0.2; out.connect(c.destination);
    const notes = [[293.66, .3], [277.18, .3], [261.63, .3], [246.94, 1.05]];
    let t = c.currentTime + 0.03;
    notes.forEach(([f, d], i) => {
      const filt = c.createBiquadFilter(); filt.type = 'lowpass'; filt.Q.value = 7;
      filt.frequency.setValueAtTime(320, t);
      filt.frequency.linearRampToValueAtTime(1700, t + 0.1);
      filt.frequency.linearRampToValueAtTime(650, t + d);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.9, t + 0.04);
      g.gain.setValueAtTime(0.9, t + d - 0.1);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      filt.connect(g); g.connect(out);
      [1, 1.005].forEach(m => {
        const o = c.createOscillator(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(f * m, t);
        if (i === 3) {
          o.frequency.linearRampToValueAtTime(f * m * 0.96, t + d);
          const lfo = c.createOscillator(); lfo.frequency.value = 5.5;
          const depth = c.createGain(); depth.gain.setValueAtTime(0, t); depth.gain.linearRampToValueAtTime(8, t + 0.35);
          lfo.connect(depth); depth.connect(o.frequency); lfo.start(t); lfo.stop(t + d);
        }
        o.connect(filt); o.start(t); o.stop(t + d + 0.02);
      });
      t += d + 0.05;
    });
  },
  glass() { // shatter
    const c = this.ready(); if (!c) return;
    const t = c.currentTime + 0.02;
    const out = c.createGain(); out.gain.value = 0.32; out.connect(c.destination);
    const len = Math.floor(c.sampleRate * 0.6), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const n = c.createBufferSource(); n.buffer = buf;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2400;
    const ng = c.createGain(); ng.gain.setValueAtTime(1, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
    n.connect(hp); hp.connect(ng); ng.connect(out); n.start(t); n.stop(t + 0.6);
    const th = c.createOscillator(); th.type = 'triangle';
    th.frequency.setValueAtTime(190, t); th.frequency.exponentialRampToValueAtTime(55, t + 0.14);
    const tg = c.createGain(); tg.gain.setValueAtTime(0.6, t); tg.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    th.connect(tg); tg.connect(out); th.start(t); th.stop(t + 0.2);
    for (let i = 0; i < 16; i++) {
      const s = t + 0.02 + Math.random() * 0.5, f = 2300 + Math.random() * 5600, dur = 0.06 + Math.random() * 0.24;
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.1 + Math.random() * 0.12, s + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
      o.connect(g); g.connect(out); o.start(s); o.stop(s + dur + 0.02);
    }
  }
};
document.addEventListener('pointerdown', () => SFX.unlock(), true);
document.addEventListener('keydown', () => SFX.unlock(), true);

// ---------- effects ----------
function glassBreak(at) {
  const fx = $('fx');
  const W = innerWidth, H = innerHeight, { x, y } = at;
  const flash = document.createElement('div'); flash.className = 'flash'; fx.appendChild(flash);
  flash.animate([{ opacity: 0 }, { opacity: 0.14, offset: 0.15 }, { opacity: 0 }], { duration: 380, easing: 'ease-out' }).onfinish = () => flash.remove();
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const rays = [], RAYS = 11;
  for (let i = 0; i < RAYS; i++) {
    let a = (i / RAYS) * Math.PI * 2 + (Math.random() - 0.5) * 0.4, px = x, py = y;
    const pts = [[px, py]], total = 75 + Math.random() * 95;
    for (let k = 0; k < 4; k++) {
      a += (Math.random() - 0.5) * 0.45;
      const seg = total / 4 * (0.7 + Math.random() * 0.6);
      px += Math.cos(a) * seg; py += Math.sin(a) * seg; pts.push([px, py]);
    }
    rays.push(pts);
  }
  const lines = rays.map(r => r);
  for (const k of [1, 2]) for (let i = 0; i < RAYS; i++) if (Math.random() < 0.75) lines.push([rays[i][k], rays[(i + 1) % RAYS][k]]);
  lines.forEach((pts, i) => {
    const pl = document.createElementNS(NS, 'polyline');
    pl.setAttribute('points', pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' '));
    pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', 'rgba(240,244,255,.85)');
    pl.setAttribute('stroke-width', i < RAYS ? '1.6' : '1'); pl.setAttribute('stroke-linecap', 'round');
    pl.setAttribute('pathLength', '1'); pl.style.strokeDasharray = '1'; pl.style.strokeDashoffset = '1';
    svg.appendChild(pl);
    pl.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: i < RAYS ? 170 : 120, delay: i < RAYS ? 0 : 110, fill: 'forwards', easing: 'ease-out' });
  });
  fx.appendChild(svg);
  svg.animate([{ opacity: 1 }, { opacity: 1, offset: 0.55 }, { opacity: 0 }], { duration: 1500, easing: 'ease-in' }).onfinish = () => svg.remove();
  for (let i = 0; i < 12; i++) {
    const sh = document.createElement('div'); sh.className = 'shard';
    const s = 7 + Math.random() * 13;
    sh.style.width = s + 'px'; sh.style.height = s * (0.6 + Math.random() * 0.8) + 'px';
    sh.style.left = x + 'px'; sh.style.top = y + 'px';
    const p = () => `${(Math.random() * 100).toFixed(0)}% ${(Math.random() * 100).toFixed(0)}%`;
    sh.style.clipPath = `polygon(${p()}, ${p()}, ${p()})`;
    fx.appendChild(sh);
    const a = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 90;
    const dx = Math.cos(a) * dist, dy = Math.sin(a) * dist + 70 + Math.random() * 60;

}

function endHand() {
  const raw = G.st.pts.slice();
  const moon = raw.indexOf(26);
  if (moon < 0) return finishHand(raw, -1, null);
  if (moon === 0) return moonChooser(c => finishHand(raw, 0, c));
  finishHand(raw, moon, botMoonChoice(moon));
}

function finishHand(raw, moon, choice) {
  const fin = moon < 0 ? raw.slice() : moonOptions(moon)[choice];
  fin.forEach((v, i) => (G.totals[i] += v));
  G.handNo++;
  const over = Math.max(...G.totals) >= S.target;
  G.phase = over ? 'over' : 'between';
  const rh = recHand();
  if (rh) {
    Object.assign(rh, { raw: raw.slice(), moon, choice: moon >= 0 ? choice : null, fin: fin.slice(), totals: G.totals.slice() });
    G.rec.totals = G.totals.slice();
    if (over) { const lo = Math.min(...G.totals); G.rec.finished = new Date().toISOString(); G.rec.winners = [0, 1, 2, 3].filter(i => G.totals[i] === lo); }
    recSave();
  }
  render();
  const low = Math.min(...G.totals);
  const order = [0, 1, 2, 3].sort((a, b) => G.totals[a] - G.totals[b]);
  const rows = order.map(i => `<tr class="${G.totals[i] === low ? 'lead' : ''}"><td>${nameOf(i)}</td><td>${fin[i] < 0 ? '−' + -fin[i] : '+' + fin[i]}</td><td class="big">${G.totals[i]}</td></tr>`).join('');
  const winners = order.filter(i => G.totals[i] === low).map(i => nameOf(i));
  let head;
  if (over) head = winners.length === 1 ? (winners[0] === 'You' ? 'You win.' : `${winners[0]} ${vb(winners[0], 'wins', 'win')}.`) : `${winners.join(' & ')} tie.`;
  else head = `Round ${G.handNo} done`;
  const nd = DIRS[G.handNo % 4];
  let react = '';
  // end of the round: the moon line first, then the winner's line if the game is over (both play)
  if (moon >= 0) react += quoteHTML(moon, 'moon');
  if (over && winners.length === 1) react += quoteHTML(G.names.indexOf(winners[0]), 'win');
  const how = choice === 'down' ? (moon === 0 ? 'You take 26 off your score.' : (isPlural(nameOf(moon)) ? 'They take 26 off their score.' : 'She takes 26 off her score.')) : 'Everyone else takes 26.';
  const moonLine = moon >= 0 ? `<div class="moon">${moon === 0 ? 'You shot the moon.' : `${nameOf(moon)} shot the moon.`} ${how}</div>` : '';
  openVeil(`<div class="panel" role="dialog" aria-label="Scores">
    <div><h2>${head}</h2><div class="sub">${over ? `Game to ${S.target}. Lowest score wins.` : `Next round: ${nd === 'hold' ? 'no passing' : 'pass ' + nd}.`}</div></div>
    ${moonLine}${react}
    <table class="tbl"><thead><tr><th>Player</th><th>Round</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="btns">${over ? `<button class="ghost" id="b-setup">Change setup</button><button class="cta" id="b-again">Play again</button>` : `<button class="cta" id="b-next">Deal next round</button>`}</div>
  </div>`);
  if (over) { $('b-again').onclick = startGame; $('b-setup').onclick = showSetup; }
  else $('b-next').onclick = () => { closeVeil(); newHand(); };
}

// ---------- rendering ----------
function handOf(p) { return G.st && G.phase !== 'pass' ? G.st.hands[p] : G.hands[p]; }

function render() {
  if (!G) return;
  renderRail(); renderPlates(); renderTrick(); renderStatus(); renderHand();
}

const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>';
const ICON_MENU = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';

function renderRail() {
  $('rail').innerHTML = `<div class="brand"><img src="brand/logo.webp" alt="BGC: Heartbreakers"></div><div class="scores">`
    + [0, 1, 2, 3].map(i => `<div class="score${i === 0 ? ' me' : ''}"><div class="who">${esc(i === 0 && S.handle ? S.handle : nameOf(i))}</div><div class="tot">${G.totals[i]}</div></div>`).join('') + `</div>`
    + `<button class="icon-btn${S.sound ? '' : ' off'}" id="b-sound" aria-label="${S.sound ? 'Turn sound effects off' : 'Turn sound effects on'}" aria-pressed="${S.sound}">${S.sound ? ICON_ON : ICON_OFF}</button>`
    + `<button class="icon-btn" id="b-menu" aria-label="Game menu">${ICON_MENU}</button>`;
  $('b-sound').onclick = () => { S.sound = !S.sound; saveSettings(); if (S.sound) SFX.unlock(); renderRail(); };
  $('b-menu').onclick = showMenu;
}

function renderPlates() {
  G.bump0 = G.shown[0] !== G.drawnPts[0];
  for (const p of [1, 2, 3]) {
    const el = $('plate' + p);
    const v = G.shown[p];
    const bump = v !== G.drawnPts[p];
    const turn = G.phase === 'play' && G.st.turn === p && !G.busy;
    el.classList.toggle('turn', turn);
    const nm = nameOf(p);
    if (p) {
      el.classList.add('seat');
      el.innerHTML = `${portraitHTML(nm, seatFlip(nm, el))}<div class="pinfo"><span class="nm">${esc(nm)}</span><span class="rule"></span><span class="pts"><b class="rp${v ? ' has' : ''}${bump ? ' bump' : ''}">${v}</b>this round</span></div>`;
      continue;
    }
    el.innerHTML = `<div class="whoc"><span class="nm">${esc(nm)}</span></div>
      <div class="rpw"><span class="rp${v ? ' has' : ''}${bump ? ' bump' : ''}">${v}</span><span class="rl">this round</span></div>`;
  }
  G.drawnPts = G.shown.slice();
}

function renderTrick() {
  const tr = $('trick');
  const have = [...tr.children];
  if (have.length > G.table.length) { tr.innerHTML = ''; have.length = 0; }
  G.table.slice(have.length).forEach(x => {
    const slot = document.createElement('div');
    slot.className = 'slot s' + x.p;
    slot.innerHTML = cardHTML(x.c, x.c === QS ? ' bounce' : ' enter');
    tr.appendChild(slot);
  });
  tr.querySelectorAll('.card').forEach(el => el.classList.toggle('won', G.wonBy != null && G.table.some(x => x.c === +el.dataset.c && x.p === G.wonBy)));
}

function myChip() {
  return `<span class="mechip" id="mechip">${portraitHTML(S.me)}<span class="mi"><span class="mn">${esc(S.me)}</span><span class="mh">${esc(S.handle || 'You')}</span><span class="mp"><b class="rp${G.shown[0] ? ' has' : ''}${G.bump0 ? ' bump' : ''}">${G.shown[0]}</b> this round</span></span></span>`;
}
function renderStatus() {
  const el = $('status');
  if (G.phase === 'pass') {
    const n = G.passSel.size;
    el.innerHTML = `<div class="row">${myChip()}</div><div class="row"><span class="msg">Pick 3 cards to pass <b>${DIRS[G.dir]}</b></span><button class="cta" id="b-pass" ${n === 3 ? '' : 'disabled'}>Pass ${n}/3</button></div>`;
    $('b-pass').onclick = confirmPass;
    return;
  }
  if (G.phase !== 'play') { el.innerHTML = ''; return; }
  const st = G.st;
  let msg;
  if (G.looking) msg = 'Here’s what you got <span class="skip">· tap to start</span>';
  else if (G.busy) msg = G.wonBy === 0 ? 'You take the trick' : `${nameOf(G.wonBy)} ${vb(nameOf(G.wonBy), 'takes', 'take')} the trick`;
  else if (st.turn === 0) {
    if (st.trickNo === 0 && !st.trick.length) msg = 'Lead the <b>2♣</b>';
    else if (G.sel != null) msg = 'Tap again to play';
    else msg = st.trick.length ? 'Your turn. Follow suit if you can' : 'Your lead';
  } else msg = `${nameOf(st.turn)} ${vb(nameOf(st.turn), 'is', 'are')} thinking…`;
  const left = 13 - st.trickNo;
  const mine = myChip();
  el.innerHTML = `<div class="row">${mine}<span class="pill count">${left} trick${left === 1 ? '' : 's'} left</span>${st.broken ? `<span class="pill broken${G.popBroken ? ' pop' : ''}">${suitMark(3)} broken</span>` : ''}</div><div class="msg">${msg}</div>`;
  G.popBroken = false;
}

function renderHand() {
  const el = $('hand');
  const hand = sortHand(handOf(0));
  const myTurn = G.phase === 'play' && G.st.turn === 0 && !G.busy;
  const legal = myTurn ? new Set(legalFor(G.st, 0)) : null;
  el.style.height = '';
  const land = matchMedia('(orientation: landscape) and (max-height: 560px), (orientation: landscape) and (min-width: 900px)').matches;
  if (land) {
    const lch = Math.min(innerHeight * 0.18, innerHeight > 560 && innerWidth >= 900 ? 160 : 100);   // computers get bigger cards
    el.style.setProperty('--ch', lch.toFixed(0) + 'px');
    el.style.setProperty('--cw', (lch * 0.7).toFixed(0) + 'px');
  } else { el.style.removeProperty('--ch'); el.style.removeProperty('--cw'); }
  const mode = land ? 'row' : S.layout;
  const cs = getComputedStyle(el);
  const W = el.clientWidth, cw = parseFloat(cs.getPropertyValue('--cw')) || 62, ch = parseFloat(cs.getPropertyValue('--ch')) || 88;
  const n = hand.length;
  // positions are offsets from the hand's center, so the hand stays centered even if the width reads wrong
  const rowPos = (m, i) => { const sx = m > 1 ? Math.min(cw + 6, (W - cw) / (m - 1)) : 0; return (i - (m - 1) / 2) * sx - cw / 2; };
  const L = off => `left:calc(50% + ${off.toFixed(1)}px)`;
  const pos = []; // per card: left, bottom, extra style
  if (mode === 'tworow') {
    const top = Math.ceil(n / 2);
    hand.forEach((c, i) => pos.push(i < top ? `${L(rowPos(top, i))};bottom:${(ch * 0.55).toFixed(0)}px` : `${L(rowPos(n - top, i - top))};bottom:0`));
  } else if (mode === 'fan') {
    const R = ch * 3.4;
    const half = Math.asin(Math.min(0.9, (W - cw) / (2 * R)));
    const stepA = n > 1 ? Math.min(7 * Math.PI / 180, (2 * half) / (n - 1)) : 0;
    const drop = R * (1 - Math.cos(stepA * (n - 1) / 2));
    el.style.height = (ch + 24 + drop).toFixed(0) + 'px';
    hand.forEach((c, i) => pos.push(`${L(-cw / 2)};bottom:${drop.toFixed(0)}px;--org:50% 340%;--rot:${((i - (n - 1) / 2) * stepA * 180 / Math.PI).toFixed(2)}deg`));
  } else {
    hand.forEach((c, i) => pos.push(L(rowPos(n, i))));
  }
  el.innerHTML = hand.map((c, i) => {
    let cls = '';
    if (G.phase === 'pass' && G.passSel.has(c)) cls += ' sel';
    if (G.phase === 'play' && G.sel === c) cls += ' sel';
    if (myTurn && !legal.has(c)) cls += ' dim';
    if (G.received.has(c)) cls += ' got';
    return cardHTML(c, cls, ` tabindex="0" style="${pos[i]};z-index:${i + 1}"`);
  }).join('');
}

function onHandTap(e) {
  const cardEl = e.target.closest('.card');
  if (!cardEl || !G) return;
  const c = +cardEl.dataset.c;
  if (G.phase === 'pass') {
    if (G.passSel.has(c)) G.passSel.delete(c);
    else if (G.passSel.size < 3) G.passSel.add(c);
    render();
    return;
  }
  if (G.phase !== 'play' || G.st.turn !== 0 || G.busy) return;
  if (!legalFor(G.st, 0).includes(c)) return;
  if (G.sel === c) playCard(0, c);
  else { G.sel = c; render(); }
}
$('hand').addEventListener('click', onHandTap);
$('hand').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onHandTap(e); } });
window.addEventListener('resize', () => { if (G) { renderHand(); renderPlates(); } });
try { matchMedia('(orientation: landscape) and (max-height: 560px), (orientation: landscape) and (min-width: 900px)').addEventListener('change', () => G && render()); } catch (e) {}
try { let lastW = 0; new ResizeObserver(() => { const w = $('hand').clientWidth; if (G && w !== lastW) { lastW = w; renderHand(); } }).observe($('hand')); } catch (e) {}

// ---------- overlays ----------
function openVeil(html) { const v = $('veil'); v.innerHTML = html; v.hidden = false; }
function closeVeil() { $('veil').hidden = true; $('veil').innerHTML = ''; }

function segHTML(name, opts, val) {
  return `<div class="seg">${opts.map(([v, l]) => `<label class="${v === 'genius' ? 'g' : ''}"><input type="radio" id="${name}-${v}" name="${name}" value="${v}" ${String(v) === String(val) ? 'checked' : ''}>${l}</label>`).join('')}</div>`;
}

function showSetup() {
  const lv = [['easy', 'Easy'], ['medium', 'Medium'], ['hard', 'Hard'], ['genius', 'Genius']];
  openVeil(`<form class="panel" id="setup" aria-label="Game setup">
    <div><h1><img class="logo" src="brand/logo.webp" alt="BGC: Heartbreakers"></h1><div class="sub">You against three other bad girls. Lowest score wins. Avoid hearts and keep away from the Queen of Spades, unless you take every point and shoot the moon.</div></div>
    <div class="field"><label class="lab" for="handle">Your name</label><input class="handle-in" id="handle" name="handle" maxlength="16" autocomplete="nickname" autocapitalize="words" spellcheck="false" placeholder="Name or handle" value="${esc(S.handle)}"></div>
    <div class="field"><span class="lab">Play as</span><div class="girls">${playable().map(n => `<label class="girl"><input type="radio" id="me-${n.replace(/\W/g, '')}" name="me" value="${esc(n)}" ${n === S.me ? 'checked' : ''}>${portraitHTML(n)}<span>${esc(n)}</span></label>`).join('')}</div></div>
    <div class="field"><span class="lab">Computer players</span>
      <div class="sub">Every girl plays her own way: Amy is Easy, the Victor Twins are Medium, Judi is Hard and Natalie is Genius.</div>
    </div>
    <div class="field"><span class="lab">Play to</span>${segHTML('target', [[50, '50 points'], [100, '100 points']], S.target)}</div>
    <div class="field"><span class="lab">Table layout</span>${segHTML('layout', LAYOUTS, S.layout)}</div>
    <div class="field"><span class="lab">Sound effects</span>${segHTML('sound', [['on', 'On'], ['off', 'Off']], S.sound ? 'on' : 'off')}</div>
    <div class="foot">Portrait art and online play with friends come next.</div>
    <div class="btns"><button class="cta" type="submit">Deal</button></div>
  </form>`);
  $('setup').addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target);
    S.target = +f.get('target');
    S.me = f.get('me') || S.me;
    S.handle = String(f.get('handle') || '').trim().slice(0, 16);
    S.sound = f.get('sound') === 'on';
    S.layout = f.get('layout');
    applyLayout();
    saveSettings();
    SFX.unlock();
    startGame();
  });
}

// ---------- sign-in: friends get a username and password (the same accounts as Glint; added and reset from admin.html) ----------
// Only the real site asks; the private Claude artifact and local copies play without it.
const GATED = !!sb && /(^|\.)glint\.haus$|\.netlify\.app$/.test(location.hostname);
const acctEmail = u => { u = String(u || '').trim().toLowerCase(); return !u || u.includes('@') ? u : u + '@glint.haus'; };
const acctName = u => (u && u.user_metadata && u.user_metadata.username) || ((u && u.email) || '').replace(/@.*$/, '');
let ME = null;
async function bootGate() {
  if (!GATED) return showSetup();
  try { const { data: { session } } = await sb.auth.getSession(); ME = session ? session.user : null; } catch (e) { ME = null; }
  if (!ME) return showSignIn();
  if (ME.user_metadata && ME.user_metadata.must_change) return showNewPassword();
  showSetup();
}
function showSignIn(note) {
  openVeil(`<form class="panel" id="signin" aria-label="Sign in">
    <div><h1><img class="logo" src="brand/logo.webp" alt="BGC: Heartbreakers"></h1><div class="sub">Sign in with the username and password you were given.</div></div>
    <div class="field"><label class="lab" for="si-u">Username</label><input class="handle-in" id="si-u" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label class="lab" for="si-p">Password</label><input class="handle-in" id="si-p" type="password" autocomplete="current-password" required></div>
    <div class="foot" id="si-msg" role="status">${esc(note || '')}</div>
    <div class="btns"><button class="cta" type="submit">Sign in</button></div>
  </form>`);
  $('signin').addEventListener('submit', async e => {
    e.preventDefault();
    $('si-msg').textContent = 'Signing in…';
    const { data, error } = await sb.auth.signInWithPassword({ email: acctEmail($('si-u').value), password: $('si-p').value });
    if (error) { $('si-msg').textContent = /invalid/i.test(error.message) ? 'That username and password don’t match.' : 'Couldn’t sign in: ' + error.message; return; }
    ME = data.user;
    if (!S.handle) { S.handle = acctName(ME).replace(/^./, c => c.toUpperCase()).slice(0, 16); saveSettings(); }
    bootGate();
  });
  setTimeout(() => $('si-u') && $('si-u').focus(), 60);
}
function showNewPassword() {
  openVeil(`<form class="panel" id="newpw" aria-label="Pick your password">
    <div><h2>Pick your own password</h2><div class="sub">You signed in with a temporary one. Choose a password only you know (at least 8 characters).</div></div>
    <div class="field"><label class="lab" for="np-1">New password</label><input class="handle-in" id="np-1" type="password" autocomplete="new-password" minlength="8" required></div>
    <div class="field"><label class="lab" for="np-2">Type it again</label><input class="handle-in" id="np-2" type="password" autocomplete="new-password" minlength="8" required></div>
    <div class="foot" id="np-msg" role="status"></div>
    <div class="btns"><button class="cta" type="submit">Save password</button></div>
  </form>`);
  $('newpw').addEventListener('submit', async e => {
    e.preventDefault();
    const a = $('np-1').value, b = $('np-2').value;
    if (a.length < 8) return ($('np-msg').textContent = 'At least 8 characters, please.');
    if (a !== b) return ($('np-msg').textContent = 'Those don’t match.');
    $('np-msg').textContent = 'Saving…';
    const { data, error } = await sb.auth.updateUser({ password: a, data: { must_change: false } });
    if (error) return ($('np-msg').textContent = 'Couldn’t save: ' + error.message);
    ME = data.user;
    showSetup();
  });
}

function showMenu() {
  openVeil(`<div class="panel" role="dialog" aria-label="Menu">
    <h2>Menu</h2>
    <div class="field"><span class="lab">Table layout</span>${segHTML('mlayout', LAYOUTS, S.layout)}</div>
    <div class="field"><span class="lab">Sound effects</span>${segHTML('msound', [['on', 'On'], ['off', 'Off']], S.sound ? 'on' : 'off')}</div>
    <div class="foot">New game ends this one and clears the scores.</div>
    <div class="btns"><button class="ghost" id="b-new">New game</button><button class="cta" id="b-keep">Back to game</button></div>
    ${ME ? `<div class="foot">Signed in as ${esc(acctName(ME))} · <button class="linkish" id="b-out" type="button">Sign out</button></div>` : ''}
  </div>`);
  $('veil').querySelectorAll('input[name="mlayout"]').forEach(r => r.onchange = () => { S.layout = r.value; applyLayout(); saveSettings(); render(); });
  $('veil').querySelectorAll('input[name="msound"]').forEach(r => r.onchange = () => { S.sound = r.value === 'on'; if (S.sound) SFX.unlock(); saveSettings(); renderRail(); });
  $('b-keep').onclick = closeVeil;
  $('b-new').onclick = () => { G = null; showSetup(); };
  if ($('b-out')) $('b-out').onclick = async () => { try { await sb.auth.signOut(); } catch (e) {} ME = null; G = null; showSignIn(); };
}

// boot: a dealt sample table behind the setup panel
applyLayout();
G = { totals: [0, 0, 0, 0], handNo: 0, names: pickCast() };
Object.assign(G, { hands: dealHands(), dir: 0, known: [[], [], [], []], received: new Set(), passSel: new Set(), phase: 'pass', st: null, table: [], shown: [0, 0, 0, 0], drawnPts: [0, 0, 0, 0] });
render();
bootGate();
</script>
