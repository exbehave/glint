<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glint</title>
<meta name="theme-color" content="#08080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glint">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="glint.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark">GLINT</div>
    <div class="row"><button class="btn" id="cycle">Cycle my designs</button><button class="btn play-btn" id="play">Play full screen</button></div>
  </header>

  <div class="main">
    <div class="stage-col">
      <div class="stage" id="stage-box">
        <canvas id="stage" aria-label="Your design"></canvas>
        <div class="beat" id="beat"></div>
        <button class="exit-play" id="exit-play" hidden>Tap to show controls</button>
        <div class="cycle-name" id="cycle-name" aria-live="polite"></div>
      </div>
      <nav class="layers" id="layers" aria-label="Visuals in this design"></nav>
    </div>

    <aside class="rack">
      <section class="card" id="designs-card">
        <h3>My designs <span id="designs-where">saved on this device</span></h3>
        <form class="row" id="save-form">
          <input class="name-in" id="design-name" type="text" placeholder="Name this combo" maxlength="40" aria-label="Design name">
          <button class="btn" type="submit" id="save-design">Save</button>
        </form>
        <div class="chips" id="design-list"></div>
        <div class="now" id="design-msg" aria-live="polite"></div>
        <div class="ctls" id="cycle-ctl"></div>
        <div class="sync" id="sync" hidden>
          <div class="row spread"><span class="now" id="sync-msg">Saved on this device only</span><button class="btn" id="sync-toggle" type="button">Sync across devices</button></div>
          <form class="sync-form" id="sync-form" hidden>
            <input class="name-in" id="sync-email" type="email" placeholder="Email" autocomplete="username" aria-label="Email">
            <input class="name-in" id="sync-pass" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
            <button class="btn" type="submit" id="sync-go">Sign in</button>
            <p class="desc">Same account as In the Loop.</p>
          </form>
        </div>
      </section>
      <section class="card" id="layer-card"></section>

      <section class="card">
        <h3>Music</h3>
        <div class="row">
          <button class="btn" id="m-demo" aria-pressed="false">Demo beat</button>
          <label class="btn file-btn" id="m-file-l" aria-pressed="false">Load a song<input type="file" id="m-file"></label>
          <button class="btn" id="m-mic" aria-pressed="false">Microphone</button>
          <button class="btn" id="m-off" aria-pressed="true">Silence</button>
        </div>
        <div class="capture" id="capture" hidden>
          <div class="cap-head">On this computer</div>
          <div class="row">
            <button class="btn" id="m-screen" aria-pressed="false">Tab or screen audio</button>
            <button class="btn" id="m-dev" aria-pressed="false">Audio input…</button>
          </div>
          <div class="row" id="dev-row" hidden>
            <select class="sel" id="dev-sel" aria-label="Audio input device"></select>
          </div>
          <p class="desc" id="cap-help"></p>
        </div>
        <div class="now" id="now">Silence · idle motion only</div>
        <div class="meter" id="meter" hidden aria-hidden="true"><i id="lvl"></i></div>
        <div class="transport" id="transport" hidden>
          <button class="btn" id="t-play" aria-label="Play">Play</button>
          <input type="range" id="t-seek" min="0" max="1000" value="0" step="1" aria-label="Song position">
          <span class="t-time" id="t-time">0:00 / 0:00</span>
        </div>
        <div class="ctls" id="music-ctl"></div>
      </section>

      <section class="card">
        <h3>Personalities <span>over the whole design</span></h3>
        <div class="chips" id="moods"></div>
        <div class="ctls" id="mood-ctl"></div>
      </section>

      <p class="foot">The previous Studio is still at <a href="studio.html">studio.html</a>.</p>
    </aside>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="engine/core.js"></script>
<script src="engine/forms.js"></script>
<script src="engine/forms2.js"></script>
<script src="engine/moods.js"></script>
<script src="glint.js"></script>
</body>
</html>
