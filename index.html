<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glint</title>
<meta name="theme-color" content="#08080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glint">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark" aria-label="Glint">Glint</div>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-tab="studio" aria-current="page">Studio</button>
      <button class="tab" data-tab="library">Library</button>
      <button class="tab" data-tab="sources">Sources</button>
      <button class="tab" data-tab="gallery">Gallery</button>
      <button class="tab" data-tab="perform">Perform</button>
    </nav>
    <div class="top-right">
      <label for="scene" class="label">Scene</label>
      <select id="scene" class="select"></select>
      <label for="aspect" class="label">Frame</label>
      <select id="aspect" class="select">
        <option value="16:9">16:9</option><option value="9:16">9:16</option><option value="1:1">1:1</option>
        <option value="4:5">4:5</option><option value="21:9">21:9</option><option value="fill">Fill</option>
      </select>
    </div>
  </header>

  <main class="studio">
    <aside class="side left" data-seg="nodes">
      <section class="panel">
        <div class="head"><span class="label">Nodes</span>
          <button class="icon-btn" id="add-node" aria-label="Add node" title="Add node"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.3"/></svg></button>
        </div>
        <ul class="list" id="node-list" role="listbox" aria-label="Nodes"></ul>
      </section>
      <section class="panel">
        <div class="head"><span class="label">Buses</span></div>
        <ul class="list" id="bus-list" aria-label="Buses"></ul>
        <p class="list-foot">A bus pushes all of its nodes together, like a group fader on a mixing desk.</p>
      </section>
    </aside>

    <section class="stage-col">
      <div class="stage-area" id="stage-area">
        <div class="stage" id="stage">
          <canvas id="fx"></canvas>
          <canvas id="ui" aria-label="Canvas. Drag a node's home point to move it; drag the arrow tip to aim it."></canvas>
        </div>
      </div>
      <div class="stage-tools">
        <div class="seg-mini" role="group" aria-label="Tool">
          <button id="tool-select" aria-pressed="true">Select</button>
          <button id="tool-place" aria-pressed="false">Place</button>
        </div>
        <label class="tool-check"><span class="switch"><input type="checkbox" id="snap" checked><span></span></span>Snap to grid</label>
        <label class="tool-check" for="grid">Grid
          <select id="grid" class="select"><option value="24">24</option><option value="32" selected>32</option><option value="48">48</option></select>
        </label>
        <button class="blend-pill" id="blend-pill" hidden aria-label="Active personalities"></button>
        <span class="hint">Shift drags freely · double-click empty grid to add a node</span>
      </div>
    </section>

    <div class="mseg">
      <div class="seg-mini" role="group" aria-label="Panel" id="mseg">
        <button data-mg="nodes" aria-pressed="false">Nodes</button>
        <button data-mg="shape" aria-pressed="true">Shape</button>
        <button data-mg="tune" aria-pressed="false">Tune</button>
        <button data-mg="mood" aria-pressed="false">Mood</button>
      </div>
    </div>

    <section class="moods" id="moods" data-seg="mood" aria-label="Personalities"></section>
    <aside class="side rack" id="rack" aria-label="Selected node"></aside>
  </main>

  <footer class="panel transport">
    <div class="np">
      <div class="np-art" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 9h1.5M5 5v8M8 2v14M11 6v6M14 4v10M16.5 9H16" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></div>
      <div class="np-text"><div class="np-title" id="np-title">Nothing playing</div><div class="np-sub" id="np-sub">Idle motion only</div></div>
    </div>
    <div class="sources">
      <button class="src" id="src-demo" aria-pressed="false"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7-4.5z" fill="currentColor"/></svg>Demo beat</button>
      <label class="src" id="src-file-label" role="button" tabindex="0"><input type="file" id="src-file"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v7M3 5l3 3 3-3M1.5 10.5h9" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>Open audio file</label>
      <button class="src" id="src-pause" hidden>Pause</button>
      <button class="src" id="src-mic" aria-pressed="false"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="4" y="1" width="4" height="6.5" rx="2" stroke="currentColor" fill="none" stroke-width="1.2"/><path d="M2.5 6a3.5 3.5 0 0 0 7 0M6 9.5V11" stroke="currentColor" fill="none" stroke-width="1.2"/></svg>Microphone</button>
    </div>
    <div class="master" id="master" aria-label="Master"></div>
    <div class="meter"><canvas id="spec" aria-hidden="true"></canvas><div class="beat" id="beat" title="Beat"></div></div>
  </footer>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab" data-tab="studio" aria-current="page"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10v0M6 6v8M10 3v14M14 7v6M17 10v0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Studio</button>
    <button class="tab" data-tab="library"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h5l1.5 1.5H17v8.5H3z" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>Library</button>
    <button class="tab" data-tab="sources"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" stroke="currentColor" stroke-width="1.3" fill="none"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>Sources</button>
    <button class="tab" data-tab="gallery"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="6" stroke="currentColor" stroke-width="1.3" fill="none"/><rect x="11" y="3" width="6" height="6" stroke="currentColor" stroke-width="1.3" fill="none"/><rect x="3" y="11" width="6" height="6" stroke="currentColor" stroke-width="1.3" fill="none"/><rect x="11" y="11" width="6" height="6" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>Gallery</button>
    <button class="tab" data-tab="perform"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>Perform</button>
  </nav>
</div>

<button class="btn-quiet exit-perform" id="exit-perform" hidden>Exit Perform</button>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button id="toast-act" hidden></button></div>
<script src="app.js"></script>
</body>
</html>
