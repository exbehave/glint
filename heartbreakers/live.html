<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Heartbreakers Live</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Montserrat:wght@600;700;800&display=swap">
<style>
/* Kennedy, Nov 9, 2026: admin-only page. The list shows every game in progress; tap one to watch its table live,
   every hand face up. Reads hb_games (the admin can read every row): data = the game record, save = the live
   table state the game pushes every ~1.5 s (hands, the trick on the table, whose turn, round points). */
:root {
  --ink: #12060f; --felt: #1d0a18; --felt-hi: #2c1026; --plate: rgba(26, 9, 23, .82); --line: rgba(214, 200, 214, .45);
  --bone: #f6edf2; --mute: #c6b0bf; --red: #ff3d8e; --club: #4fe3b2; --violet: #b28cff; --silver: #ece8f2;
  --face: #2b0f27; --face-2: #150712;
  --serif: "Quicksand", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --caps: "Montserrat", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--ink); }
body { margin: 0; min-height: 100dvh; background: var(--ink) url("img/bg-port.webp") center top / cover fixed no-repeat; color: var(--bone); font: 600 16px/1.4 var(--serif); }
body.watching { background: radial-gradient(120% 80% at 50% 42%, var(--felt-hi) 0%, var(--felt) 48%, var(--ink) 100%) fixed; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 16px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-direction: column; align-items: center; gap: 4px; }
header img { width: min(260px, 70%); filter: drop-shadow(0 0 12px rgba(255, 61, 142, .45)); }
header .sub { font: 700 11px var(--caps); letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
body.watching header { display: none; }
.card { background: var(--plate); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
h2 { margin: 0 0 4px; font: 700 19px var(--serif); }
.desc { margin: 0; color: var(--mute); font-size: 14px; font-weight: 500; }
.lab { font: 700 10.5px var(--caps); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
input, button { font: inherit; color: inherit; }
.in { width: 100%; background: rgba(0, 0, 0, .35); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; font-size: 16px; }
.in:focus { border-color: var(--red); }
.btn { border: 1.5px solid var(--red); background: rgba(255, 61, 142, .14); border-radius: 99px; padding: 9px 18px; font-weight: 700; cursor: pointer; }
.ghost { border: 1.5px solid var(--line); background: none; border-radius: 99px; padding: 7px 14px; font-weight: 600; cursor: pointer; color: var(--mute); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
form.signin { display: flex; flex-direction: column; gap: 10px; }
.msg { min-height: 1.2em; font-size: 14px; color: var(--mute); }
.msg.err { color: var(--red); }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* portraits */
.pw { width: 44px; aspect-ratio: 4 / 5; border-radius: 8px; overflow: hidden; display: grid; place-items: center; flex: none;
  background: radial-gradient(85% 65% at 50% 32%, #3b2d48, #17131c 70%); font: 700 14px var(--caps); color: var(--mute); border: 1px solid rgba(214, 200, 214, .25); }
.pw img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; display: block; }
.pw.flip img { transform: scaleX(-1); }

/* list */
.games { display: flex; flex-direction: column; gap: 10px; }
.game { width: 100%; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
.game:hover { border-color: var(--red); }
.game .who { display: flex; gap: 12px; align-items: center; }
.game .who .pw { width: 56px; }
.game .nm { font-size: 18px; font-weight: 700; line-height: 1.2; }
.game .as { font-size: 13px; color: var(--mute); font-weight: 600; }
.game .vs { display: flex; gap: 8px; align-items: flex-end; }
.game .vs .op { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: var(--mute); width: 56px; text-align: center; line-height: 1.1; }
.game .vs .op b { color: var(--bone); font-size: 14px; }
.game .vs .op .pw { width: 40px; }
.game .vs .me b { color: var(--red); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { font: 700 9.5px var(--caps); letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--mute); }
.tag.live { border-color: var(--club); color: var(--club); }
.tag.live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--club); margin-right: 5px; vertical-align: 1px; animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
.ago { font-size: 12.5px; color: var(--mute); margin-left: auto; }
.empty { text-align: center; padding: 28px 16px; }

/* table */
.top { display: flex; align-items: center; gap: 10px; }
.top .title { flex: 1; min-width: 0; }
.top .title b { display: block; font-size: 17px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .title span { font-size: 12.5px; color: var(--mute); }
.status { text-align: center; font-size: 14px; color: var(--mute); min-height: 1.4em; }
.status b { color: var(--bone); }
.table { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 1.25fr) minmax(0, 1fr); grid-template-areas: "s2 s2 s2" "s1 mid s3" "s0 s0 s0"; gap: 10px; }
.seat { grid-area: var(--a); background: rgba(10, 3, 9, .45); border: 1.5px solid rgba(214, 200, 214, .2); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; transition: border-color .3s, box-shadow .3s; }
.seat.turn { border-color: var(--red); box-shadow: 0 0 0 1px var(--red), 0 0 18px rgba(255, 61, 142, .3); }
.seat .hd { display: flex; gap: 8px; align-items: center; min-width: 0; }
.seat .hd .nm { font-size: 14px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.seat .hd .sc { font-size: 12px; color: var(--mute); }
.seat .hd .sc b { color: var(--bone); }
.seat .hd .sc .rp { color: var(--red); }
.seat.s1 .hd, .seat.s3 .hd { flex-direction: column; align-items: flex-start; }
.chips { display: flex; flex-wrap: wrap; gap: 3px; }
.seat.s1 .chips, .seat.s3 .chips { gap: 3px; }
.chip { width: 25px; height: 34px; border-radius: 5px; background: linear-gradient(165deg, var(--face), var(--face-2)); border: 1px solid #443c4e; color: var(--sc, var(--silver));
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: .95; font: 800 13px var(--caps); }
.chip i { font-style: normal; font-size: 11px; }
.chip.red, .pc.red { --sc: var(--red); }
.chip.club, .pc.club { --sc: var(--club); }
.chip.qs, .pc.qs { border-color: color-mix(in srgb, var(--violet) 75%, transparent); box-shadow: 0 0 10px color-mix(in srgb, var(--violet) 45%, transparent); }
.seat.s0 .chip { width: 34px; height: 46px; font-size: 16px; }
.seat.s0 .chip i { font-size: 13px; }
.chip.gone { opacity: 0; transform: translateY(-6px); transition: opacity .3s, transform .3s; }
.mid { grid-area: mid; position: relative; min-height: 200px; border-radius: 14px; }
.slot { position: absolute; }
.slot.s0 { left: 50%; bottom: 0; translate: -50% 0; }
.slot.s2 { left: 50%; top: 0; translate: -50% 0; }
.slot.s1 { left: 0; top: 50%; translate: 0 -50%; }
.slot.s3 { right: 0; top: 50%; translate: 0 -50%; }
.pc { --sc: var(--silver); position: relative; width: 50px; height: 70px; border-radius: 7px; background: linear-gradient(165deg, var(--face), var(--face-2)); border: 1px solid #443c4e;
  box-shadow: 0 6px 18px rgba(0,0,0,.55); color: var(--sc); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: .9; font: 800 21px var(--caps); }
.pc i { font-style: normal; font-size: 17px; margin-top: 3px; }
.pc.won { box-shadow: 0 0 0 2px var(--bone), 0 8px 24px rgba(0,0,0,.6); }
.slot.s0 .pc.enter { animation: in0 .32s ease-out; } .slot.s1 .pc.enter { animation: in1 .32s ease-out; }
.slot.s2 .pc.enter { animation: in2 .32s ease-out; } .slot.s3 .pc.enter { animation: in3 .32s ease-out; }
@keyframes in0 { from { transform: translateY(60px); opacity: 0; } } @keyframes in2 { from { transform: translateY(-60px); opacity: 0; } }
@keyframes in1 { from { transform: translateX(-60px); opacity: 0; } } @keyframes in3 { from { transform: translateX(60px); opacity: 0; } }
.pill { font: 700 10px var(--caps); letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--mute); }
.pill.broken { border-color: var(--red); color: var(--red); }
.last { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--mute); }
.last .chips { gap: 4px; }
.last .chip { width: 28px; height: 38px; }
.last .chip.win { box-shadow: 0 0 0 1.5px var(--bone); }
.scores { width: 100%; border-collapse: collapse; font-size: 14px; }
.scores th { font: 700 10px var(--caps); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); text-align: right; padding: 4px 6px; }
.scores th:first-child, .scores td:first-child { text-align: left; }
.scores td { text-align: right; padding: 5px 6px; border-top: 1px solid rgba(214, 200, 214, .18); font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--mute); text-align: center; }
@media (max-width: 430px) {
  .table { grid-template-columns: minmax(0, 1fr) 132px minmax(0, 1fr); gap: 8px; }
  .chip { width: 22px; height: 31px; font-size: 12px; }
  .chip i { font-size: 10px; }
  .seat.s0 .chip { width: 30px; height: 42px; font-size: 15px; }
  .pc { width: 42px; height: 60px; font-size: 18px; }
  .pc i { font-size: 14px; }
  .mid { min-height: 176px; }
  .seat .pw { width: 36px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="img/logo.webp" alt="BGC: Heartbreakers"><span class="sub">Live tables</span></header>
  <main id="main"><div class="card"><p class="desc">Loading…</p></div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="../account.js"></script>
<script>
const SUPA_URL = 'https://lwbbkwftkxjmrpyalrwu.supabase.co', SUPA_KEY = 'sb_publishable_j4FskQJtwZnxNBZXH61QJQ_U62I-eaY';
const sb = window.supabase ? window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: true, autoRefreshToken: true } }) : null;
const IMG = { 'Natalie': 'natalie', 'Kristen': 'kristen', 'Judi': 'judi', 'Victor Twins': 'victor-twins', 'Amy': 'amy', 'Dalila': 'dalila', 'Shan-Rock': 'shanrock', 'Clermont Twins': 'clermonts' };
const RENAMED = { 'Clermonts': 'Clermont Twins' };
const FACING = { 'Amy': 'right', 'Dalila': 'right', 'Shan-Rock': 'left' };   // same rule as the game: mirrored on the right-hand seat so she looks in
const SYM = ['♣', '♦', '♠', '♥'], DIRS = ['left', 'right', 'across', 'no pass'], QS = 36;
const suit = c => Math.floor(c / 13), rank = c => (c % 13) + 2;
const RL = r => ({ 11: 'J', 12: 'Q', 13: 'K', 14: 'A' })[r] || String(r);
const pts = c => (suit(c) === 3 ? 1 : c === QS ? 13 : 0);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const initials = n => String(n || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2);
const renamed = n => RENAMED[n] || n;
const LIVE_MS = 3 * 60e3;        // a move in the last 3 minutes = playing now
const SHOW_MS = 24 * 3600e3;     // unfinished games idle up to a day are listed as paused
let USERS = {};                  // user_id -> username, from the glint-accounts function (admin only)
async function loadUsers() {
  try {
    const { data, error } = await sb.functions.invoke('glint-accounts', { body: { action: 'list' } });
    if (!error && data && data.users) for (const u of data.users) USERS[u.id] = u.username;
  } catch (e) {}
}
const whoOf = r => (r.data && r.data.handle) || USERS[r.user_id] || 'Player';

function ago(t) {
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 10) return 'just now';
  if (s < 60) return s + ' s ago';
  const m = Math.round(s / 60); if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); return h + ' hr ago';
}
function portrait(n, flip) {
  const f = IMG[renamed(n)];
  return `<span class="pw${flip ? ' flip' : ''}">${f ? `<img src="img/${f}.webp" alt="">` : esc(initials(n))}</span>`;
}
const cls = c => (suit(c) === 1 || suit(c) === 3 ? ' red' : suit(c) === 0 ? ' club' : '') + (c === QS ? ' qs' : '');
const chip = (c, x = '') => `<span class="chip${cls(c)}${x}" data-c="${c}" aria-label="${RL(rank(c))}${SYM[suit(c)]}">${RL(rank(c))}<i>${SYM[suit(c)]}</i></span>`;
const card = (c, x = '') => `<div class="pc${cls(c)}${x}" aria-label="${RL(rank(c))}${SYM[suit(c)]}">${RL(rank(c))}<i>${SYM[suit(c)]}</i></div>`;
const sortHand = h => h.slice().sort((a, b) => suit(a) - suit(b) || rank(a) - rank(b));

// ---------- sign-in (same as the quotes page) ----------
function signinView(note) {
  stopAll();
  document.body.classList.remove('watching');
  $('#main').innerHTML = `<form class="card signin" id="signin">
    <h2>Sign in</h2><p class="desc">Use your Glint username and password.</p>
    <input class="in" id="u" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Username" required>
    <input class="in" id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <div class="row spread"><span class="msg${note ? ' err' : ''}" id="smsg">${esc(note || '')}</span><button class="btn" type="submit">Sign in</button></div></form>`;
  $('#signin').addEventListener('submit', async e => {
    e.preventDefault();
    $('#smsg').className = 'msg'; $('#smsg').textContent = 'Signing in…';
    const email = window.GlintAccount ? GlintAccount.email($('#u').value) : $('#u').value.trim();
    const { error } = await sb.auth.signInWithPassword({ email, password: $('#pw').value });
    if (error) { $('#smsg').className = 'msg err'; $('#smsg').textContent = error.message === 'Invalid login credentials' ? 'That username and password don’t match.' : error.message; return; }
    start();
  });
}
async function start() {
  if (!sb) { $('#main').innerHTML = `<div class="card"><p class="desc">Couldn’t load the sign-in library. Check your connection and reload.</p></div>`; return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return signinView();
  if (window.GlintAccount) GlintAccount.gate(sb, session.user, start);
  const { data: isAdmin } = await sb.rpc('glint_is_admin');
  if (!isAdmin) {
    $('#main').innerHTML = `<div class="card"><h2>Admins only</h2><p class="desc">Signed in as ${esc(window.GlintAccount ? GlintAccount.name(session.user) : session.user.email)}. This page is for the game’s admin.</p><div class="row" style="margin-top:12px"><button class="ghost" id="out" type="button">Sign out</button></div></div>`;
    $('#out').onclick = async () => { await sb.auth.signOut(); signinView(); };
    return;
  }
  await loadUsers();
  route();
}

// ---------- polling: the list every 5 s, a watched table every 1.5 s; paused while the page is hidden ----------
let timer = 0, watching = null, lastRow = null, prevTable = '', prevLastTrick = '';
function stopAll() { clearTimeout(timer); timer = 0; }
function schedule(fn, ms) { stopAll(); timer = setTimeout(() => { if (document.hidden) schedule(fn, ms); else fn(); }, ms); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && sb) (watching ? pollTable : pollList)(); });
addEventListener('hashchange', route);
function route() {
  const id = (location.hash.match(/^#g=([\w-]+)/) || [])[1] || null;
  watching = id; lastRow = null; prevTable = ''; prevLastTrick = '';
  document.body.classList.toggle('watching', !!id);
  if (id) { $('#main').innerHTML = `<div class="card"><p class="desc">Loading the table…</p></div>`; pollTable(); }
  else { $('#main').innerHTML = `<div class="card"><p class="desc">Looking for games…</p></div>`; pollList(); }
}

// ---------- list ----------
async function pollList() {
  if (watching) return;
  const since = new Date(Date.now() - SHOW_MS).toISOString();
  const { data, error } = await sb.from('hb_games').select('id, user_id, started_at, updated_at, data').eq('finished', false).not('save', 'is', null).gte('updated_at', since).order('updated_at', { ascending: false }).limit(40);
  if (watching) return;
  if (error) { $('#main').innerHTML = `<div class="card"><p class="desc">Couldn’t load games: ${esc(error.message)}</p></div>`; return schedule(pollList, 8000); }
  // Only games that can still be picked up: the game clears `save` when a player exits (practice or rated),
  // and marks `data.quit` on a rated exit. Debug games never belong here.
  drawList((data || []).filter(r => r.data && !r.data.quit && !r.data.debug));
  schedule(pollList, 5000);
}
function drawList(rows) {
  const live = rows.filter(r => Date.now() - Date.parse(r.updated_at) < LIVE_MS);
  const paused = rows.filter(r => !live.includes(r));
  const tile = r => {
    const d = r.data || {}, names = (d.names || []).map(renamed), tot = d.totals || [0, 0, 0, 0];
    const isLive = live.includes(r);
    const rounds = (d.hands || []).length;
    const ops = [1, 2, 3].map(p => `<span class="op">${portrait(names[p])}${esc(names[p] || '?')}<b>${tot[p] ?? 0}</b></span>`).join('');
    return `<button class="card game" type="button" data-id="${esc(r.id)}">
      <div class="who">${portrait(renamed(d.me))}<div><div class="nm">${esc(whoOf(r))}</div><div class="as">as ${esc(renamed(d.me) || '?')}</div></div></div>
      <div class="vs"><span class="op me">${portrait(renamed(d.me))}${esc(whoOf(r))}<b>${tot[0] ?? 0}</b></span>${ops}</div>
      <div class="tags">${isLive ? '<span class="tag live">Live</span>' : '<span class="tag">Paused</span>'}${d.practice ? '<span class="tag">Practice</span>' : '<span class="tag">Rated</span>'}<span class="tag">Round ${rounds || 1}</span><span class="tag">to ${esc(d.target || 100)}</span><span class="ago">${ago(Date.parse(r.updated_at))}</span></div>
    </button>`;
  };
  const sect = (title, list) => list.length ? `<div class="lab">${title}</div><div class="games">${list.map(tile).join('')}</div>` : '';
  $('#main').innerHTML = `<div class="row spread"><span class="lab">${live.length ? live.length + ' playing now' : 'Nobody’s playing right now'}</span><button class="ghost" id="out" type="button">Sign out</button></div>
    ${rows.length ? (live.length ? `<div class="games">${live.map(tile).join('')}</div>` : '') + sect('Paused · can still be picked up (last 24 hours)', paused) : `<div class="card empty"><p class="desc">No games in progress. This page checks every few seconds, so leave it open.</p></div>`}`;
  $('#out').onclick = async () => { await sb.auth.signOut(); signinView(); };
  document.querySelectorAll('.game').forEach(b => b.onclick = () => { location.hash = 'g=' + b.dataset.id; });
}

// ---------- watching one table ----------
async function pollTable() {
  const id = watching;
  if (!id) return;
  const { data, error } = await sb.from('hb_games').select('id, user_id, updated_at, finished, data, save').eq('id', id).maybeSingle();
  if (watching !== id) return;
  if (error || !data) { $('#main').innerHTML = `<div class="card"><p class="desc">${error ? 'Couldn’t load this game: ' + esc(error.message) : 'That game isn’t here anymore.'}</p><div class="row" style="margin-top:12px"><button class="ghost" id="back" type="button">‹ All games</button></div></div>`; $('#back').onclick = () => { location.hash = ''; }; return schedule(pollTable, 4000); }
  lastRow = data;
  drawTable(data);
  if (!data.finished) schedule(pollTable, 1500);
}
function lastTrickOf(d) {
  // the most recent complete trick from the record (saved after every trick): [[seat, card], ...] and who won it
  const hs = d.hands || [];
  for (let i = hs.length - 1; i >= 0; i--) {
    const pl = hs[i].plays || [];
    if (pl.length >= 4) {
      const t = pl.slice(Math.floor((pl.length - 1) / 4) * 4, Math.floor((pl.length - 1) / 4) * 4 + 4);
      if (t.length < 4) continue;
      const ls = suit(t[0][1]); let w = t[0];
      for (const x of t) if (suit(x[1]) === ls && rank(x[1]) > rank(w[1])) w = x;
      return { t, w: w[0], round: i + 1 };
    }
  }
  return null;
}
function drawTable(row) {
  const d = row.data || {}, sv = row.save && row.save.g ? row.save.g : null;
  const names = (d.names || []).map(renamed), me = renamed(d.me), handle = whoOf(row);
  const label = p => (p === 0 ? handle : names[p] || '?');
  const girl = p => (p === 0 ? me : names[p]);
  const totals = (sv && sv.totals) || d.totals || [0, 0, 0, 0];
  const phase = row.finished ? 'over' : sv ? sv.phase : null;
  const st = sv && sv.st;
  const hands = phase === 'play' && st ? st.hands : sv ? sv.hands : null;
  const round = sv ? (sv.handNo || 0) + 1 : (d.hands || []).length || 1;
  const roundPts = st && st.pts ? st.pts : [0, 0, 0, 0];
  const turn = phase === 'play' && st ? st.turn : -1;
  const table = phase === 'play' && sv ? (sv.table || st.trick || []) : [];
  const updated = Date.parse(row.updated_at), savedAt = row.save && row.save.at ? row.save.at : updated;
  const live = !row.finished && Date.now() - Math.max(updated, savedAt) < LIVE_MS;

  let status;
  if (row.finished) {
    const low = Math.min(...totals), win = [0, 1, 2, 3].filter(p => totals[p] === low).map(label);
    status = `<b>Game over.</b> ${esc(win.join(' and '))} ${win.length > 1 ? 'tie' : 'wins'}.`;
  } else if (!sv) status = 'Waiting for the table to save…';
  else if (phase === 'pass') status = `Round ${round} · <b>Passing ${esc(DIRS[sv.dir] || '')}</b>`;
  else if (phase === 'between') status = `<b>Between rounds</b> · round ${round} just ended`;
  else status = [`Round ${round}`, turn === 0 ? `<b>${esc(handle)}’s turn</b>` : turn > 0 ? `${esc(label(turn))}’s turn` : '', st && st.broken ? '<span class="pill broken">♥ broken</span>' : ''].filter(Boolean).join(' · ');

  const seat = p => {
    const h = hands && hands[p] ? sortHand(hands[p]) : [];
    const flip = (p === 3 && FACING[girl(p)] === 'right') || (p === 1 && FACING[girl(p)] === 'left');
    const rp = roundPts[p] ? ` <span class="rp">+${roundPts[p]}</span>` : '';
    return `<div class="seat s${p}${turn === p ? ' turn' : ''}" style="--a:s${p}">
      <div class="hd">${portrait(girl(p), flip)}<div><div class="nm">${esc(label(p))}${p === 0 ? ` <span class="sc">as ${esc(me)}</span>` : ''}</div><div class="sc">Total <b>${totals[p] ?? 0}</b>${rp}</div></div></div>
      ${h.length ? `<div class="chips">${h.map(c => chip(c)).join('')}</div>` : ''}</div>`;
  };
  // cards newly on the table slide in from their seat
  const key = table.map(x => x.p + ':' + x.c).join(',');
  const before = new Set(prevTable ? prevTable.split(',') : []);
  prevTable = key;
  const mid = `<div class="mid">${table.map(x => `<div class="slot s${x.p}">${card(x.c, before.has(x.p + ':' + x.c) ? '' : ' enter')}</div>`).join('')}</div>`;

  const lt = lastTrickOf(d);
  let last = '';
  if (lt) {
    const got = lt.t.reduce((s, x) => s + pts(x[1]), 0);
    last = `<div class="last"><span class="lab">Last trick</span><span class="chips">${lt.t.map(x => chip(x[1], x[0] === lt.w ? ' win' : '')).join('')}</span><span>${esc(label(lt.w))} took it${got ? ` · ${got} pt${got === 1 ? '' : 's'}` : ''}</span></div>`;
  }
  const rows = (d.hands || []).filter(h => h.totals);
  const sheet = `<details class="card"><summary class="lab" style="cursor:pointer">Scores by round</summary>
    <table class="scores"><tr><th>Round</th>${[0, 1, 2, 3].map(p => `<th>${esc(label(p))}</th>`).join('')}</tr>
    ${rows.map((h, i) => `<tr><td>${i + 1}${h.moon != null && h.moon >= 0 ? ' 🌙' : ''}</td>${[0, 1, 2, 3].map(p => `<td>${(h.raw && h.raw[p]) ?? ''}</td>`).join('')}</tr>`).join('')}
    <tr><td><b>Total</b></td>${[0, 1, 2, 3].map(p => `<td><b>${totals[p] ?? 0}</b></td>`).join('')}</tr></table></details>`;

  const open = document.querySelector('details') && document.querySelector('details').open;
  $('#main').innerHTML = `<div class="top"><button class="ghost" id="back" type="button">‹ All games</button><div class="title"><b>${esc(handle)} as ${esc(me)}</b><span>${d.practice ? 'Practice' : 'Rated'} · to ${esc(d.target || 100)} · ${live ? 'live' : 'last move ' + ago(Math.max(updated, savedAt))}</span></div>${live ? '<span class="tag live">Live</span>' : ''}</div>
    <div class="status">${status}</div>
    <div class="table">${seat(2)}${seat(1)}${mid}${seat(3)}${seat(0)}</div>
    ${last}${sheet}
    <p class="note">Updates every couple of seconds. ${esc(handle)} can’t tell you’re watching.</p>`;
  if (open) document.querySelector('details').open = true;
  $('#back').onclick = () => { location.hash = ''; };
}
start();
</script>
</body>
</html>
